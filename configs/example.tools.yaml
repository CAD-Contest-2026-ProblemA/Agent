# Template for configs/tools.yaml (git-ignored — per-machine external tool paths,
# so the agent does not rely on $PATH).
#
# Usage:
#     cp configs/example.tools.yaml configs/tools.yaml
#     # then edit configs/tools.yaml and set `abc` to THIS machine's abc binary
#
# NOTE: build.sh bundles configs/tools.yaml into the shipped binary, so the
# paths in it should be the *target machine's* paths; where they don't exist
# the agent falls back to env vars (ABC_BIN / YOSYS_BIN / CADA_<NAME>_BIN),
# then built-in candidates, then $PATH.
#
# Note: abc.rc must sit next to the abc binary (standard ABC layout) — point
# `abc` at the real binary, not a wrapper, so resyn2/dc2 aliases resolve.

tools:
  # abc is required (equivalence + optimization). Set it to YOUR abc binary:
  abc: /path/to/abc/abc

  # yosys is optional but recommended: the resynthesis engine
  # (cada/optimize/resynth.py) uses it as an extra optimization seed (it won
  # the depth race on some benchmarks), and the equivalence checker keeps it
  # as a fallback.  The agent degrades gracefully (skips the yosys seed) when
  # no yosys is found — results stay valid, occasionally slightly deeper.
  yosys: /path/to/yosys
