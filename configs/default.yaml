provider: "openai"          # or: "anthropic"

openai:
  api_key: <YOUR_API_KEY>
  model: "gpt-4o-mini"

anthropic:
  api_key: <YOUR_API_KEY>
  model: "claude-haiku-4-5"

generation:
  temperature: 0.2
  max_output_tokens: 4096

# Optional: pin external tool locations here too (overrides configs/tools.yaml).
# Usually you only need configs/tools.yaml; uncomment to override per-run.
# tools:
#   abc: /path/to/abc/abc
#   yosys: /path/to/yosys
